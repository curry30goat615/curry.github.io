<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的简单网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* 导航栏 */
        nav {
            background: #2c3e50;
            padding: 1rem 5%;
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        nav a {
            color: #fff;
            text-decoration: none;
        }
        nav a:hover {
            color: #3498db;
        }
        /* 头部横幅 */
        .banner {
            background: #3498db;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .banner h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .banner p {
            font-size: 18px;
            opacity: 0.9;
        }
        /* 内容区域 */
        .content {
            padding: 60px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .content h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .card {
            border: 1px solid #eee;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }
        .card h3 {
            margin-bottom: 12px;
            color: #2c3e50;
        }
        /* 页脚 */
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <nav>
        <div class="container">
            <div class="logo">简易网站</div>
            <ul>
                <li><a href="#home">首页</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#service">服务</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </div>
    </nav>

    <!-- 横幅 -->
    <section class="banner" id="home">
        <h1>欢迎来到我的网站</h1>
        <p>这是一个使用 HTML + CSS 制作的简单响应式网页</p>
    </section>

    <!-- 主体内容 -->
    <section class="content" id="about">
        <h2>我们能做什么</h2>
        <div class="cards">
            <div class="card">
                <h3>网页开发</h3>
                <p>使用HTML、CSS、JavaScript搭建静态网站，页面简洁美观，适配手机和电脑。</p>
            </div>
            <div class="card">
                <h3>页面设计</h3>
                <p>简约干净的页面风格，合理布局，良好的阅读体验。</p>
            </div>
            <div class="card">
                <h3>代码维护</h3>
                <p>代码结构清晰，方便修改、扩展和二次开发。</p>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer id="contact">
        <p>© 2026 简易网站 | 联系方式：example@mail.com</p>
    </footer>
</body>
</html>
